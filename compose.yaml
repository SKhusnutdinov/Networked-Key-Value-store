services:
  kvstore:
    build: .
    ports:
      - "6379:6379"
      - "8000:8000"
    volumes:
      - kvstore-data:/data

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
  
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  kvstore-data:
  grafana-data:
